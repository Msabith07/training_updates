<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #inp{
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: -800px;
            align-items: center;
        }
        #input{
            width: 400px;
            height: 50px;
            font-size: 1.5rem;
            text-align: center;
        }
        button{
            width: 100px;
            height: 50px;
        }
        .butn{
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div id="inp">
        <input type="text" placeholder="Enter your name" id="input" name="input" value="">
        <div class="butn">
            <button id="submit">submit</button>
            <button id="add">add</button>
            <button id="delete">delete</button>
        </div>
        <div class="result" id="result">

        </div>
    </div>
    <script>
        let sub=document.getElementById("submit");
        let inp=document.getElementById("input");
        let res=document.getElementById("result")
        sub.addEventListener('click',()=>{
            console.log(inp.value);
            // localStorage.setItem("name",`${inp.value}`)
            res.innerHTML=`
            <h1>${inp.value}</h1>
            `
        })
    </script>
</body>
</html>
