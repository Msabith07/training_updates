<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>traffic</title>
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        background-color: rgb(80, 78, 78);
        margin: 100px;
      }
      .main {
        background-color: gray;
        height: 600px;
        width: 200px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        justify-content: center;
        align-items: center;
        border-radius: 90px;
      }
      .sub {
        height: 30%;
        width: 80%;
        background-color: black;
        border-radius: 50%;
      }
      #one {
        background-color: red;
      }
      .stand {
        height: 600px;
        width: 50px;
        background-color: gray;
      }
      button {
        width: 100px;
        height: 100px;
        background-color: gray;
        margin-top: -500px;
        font-size: 2rem;
        border-radius: 20px;
        box-shadow: 2px 2px 4px black;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="sub" id="one"></div>
      <div class="sub" id="two"></div>
      <div class="sub" id="three"></div>
    </div>
    <div class="stand"></div>
    <button>start</button>
    <script>
      let inid = null;
      let one = document.getElementById("one");
      let two = document.getElementById("two");
      let three = document.getElementById("three");
      let btn = document.getElementsByTagName("button")[0];
      let t1,t2;
      let timeout=[];
      function myFunction(event) {
        let x = () => {
          one.style.background = "red";
          two.style.background = "black";
          three.style.background = "black";
          // console.log("one");
          t1=setTimeout(() => {
            one.style.background = "black";
            two.style.background = "yellow";
            three.style.background = "black";
            // console.log("two");
          }, 1000);
          t2=setTimeout(() => {
            one.style.background = "black";
            two.style.background = "black";
            three.style.background = "green";
            // console.log("three");
          }, 2000);
          timeout.push(t1,t2);
        };
        x();
        inid = setInterval(x,3000);
      }

      let running = false;
      btn.addEventListener("click", () => {
        if (!running) {
          btn.innerHTML = "stop";
          myFunction();
          running = true;
          console.log("start");
        } else {
          btn.innerHTML = "start";
          clearInterval(inid);
          inid=null
          timeout.forEach((id)=>{
            clearTimeout(id)
          })
          timeout=[]
          inid = null;
          running = false;
          console.log("stop");
        }
      });
    </script>
  </body>
</html>
