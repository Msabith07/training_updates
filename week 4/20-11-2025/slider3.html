<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slider3</title>
</head>
<body>
    <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sliders3</title>
    <style>
      * {
        transition: all 1s ease;
      }
      .main {
        background-color: lightblue;
        height: 80vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        padding: 10px;
        position: relative;
      }
      .about {
        margin: 10px;
        flex: 50%;
        background-color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
        text-align: justify;
        text-align-last: center;
        flex-direction: column;
        box-shadow: 2px 2px 6px black;
      }
      .slide1 {
        background-color: gray;
        width: 30px;
        height: 30px;

        cursor: pointer;
      }
      img {
        display: none;
      }
      .slide2 {
        background-color: gray;
        width: 30px;
        height: 30px;
        cursor: pointer;
      }
      .slide {
        display: flex;
        gap: 50px;
        margin: 50px;
        justify-content: center;
      }
    </style>
    <script>
      function myFunction(event) {
        let one=document.getElementById("about2");
        let two=document.getElementById("img");
        console.log("activated");
        const clicked=event.target;
        console.log(clicked);
        let click1 = clicked.classList.contains("slide1");
        if (!click1) {
            one.style.display="none"
            two.style.display="block"
        }
        else{
            one.style.display="block"
            two.style.display="none"
        }
      }
    </script>
  </head>
  <body>
    <div class="main">
      <div class="about">
        <div class="about2" id="about2">
          <h1>Lorem ipsum dolor sit amet.</h1>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Repudiandae
            sit quia praesentium suscipit dolorem iure velit, quidem natus
            tempore laudantium similique perspiciatis. Cum ad et facilis
            architecto sed! Laudantium, assumenda?
          </p>
        </div>
        <img src="MUhammad_Sabith.jpg" alt="hi" id="img" />
      </div>
      <div class="slide">
        <div class="slide1" onclick="myFunction(event)"></div>
        <div class="slide2" onclick="myFunction(event)"></div>
      </div>
    </div>
  </body>
</html>

</body>
</html>
