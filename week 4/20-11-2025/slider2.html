<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sliders2</title>
    <style>
      * {
        transition: all 1s ease;
      }
      .main {
        background-color: lightblue;
        height: 80vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        padding: 10px;
        position: relative;
      }
      .about {
        margin: 10px;
        flex: 50%;
        background-color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
        text-align: justify;
        text-align-last: center;
        flex-direction: column;
        box-shadow: 2px 2px 6px black;
      }
      .slide1 {
        background-color: gray;
        width: 30px;
        height: 30px;

        cursor: pointer;
      }
      img {
        display: none;
      }
      .slide2 {
        background-color: gray;
        width: 30px;
        height: 30px;
        cursor: pointer;
      }
      .slide {
        display: flex;
        gap: 50px;
        margin: 50px;
        justify-content: center;
      }
    </style>
    <script>
      function myFunction1() {
        console.log("first activated");
        let one = document.getElementById("about2");
        let two = document.getElementById("img");
        one.style.display="none"
        two.style.display = "block";
      }
      function myFunction2() {
        console.log("second activated");
        let one = document.getElementById("img");
        let two = document.getElementById("about2");
        one.style.display="none"
        two.style.display = "block";
      }
    </script>
  </head>
  <body>
    <div class="main">
      <div class="about">
        <div class="about2" id="about2">
          <h1>Lorem ipsum dolor sit amet.</h1>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Repudiandae
            sit quia praesentium suscipit dolorem iure velit, quidem natus
            tempore laudantium similique perspiciatis. Cum ad et facilis
            architecto sed! Laudantium, assumenda?
          </p>
        </div>
        <img src="MUhammad_Sabith.jpg" alt="hi" id="img" />
      </div>
      <div class="slide">
        <div class="slide1" onclick="myFunction1()"></div>
        <div class="slide2" onclick="myFunction2()"></div>
      </div>
    </div>
  </body>
</html>
