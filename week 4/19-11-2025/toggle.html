<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toggle</title>
    <style>
        .toggle{
            width: 236px;
            height: 120px;
            background-color: gray;
            border-radius: 57px;
            display: flex;
        }
        .bod{
            background-color: pink;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .sub{
            width: 116px;
            height: 116px;
            background-color: white;
            border-radius: 50%;
            border: 3.5px solid gray;
            box-shadow: 2px 2px 4px black;
        }
        .bus1{
            transform: translateX(0px);
            transition: transform 1s ease;
            border: 3.5px solid gray;

        }
        .bus{
            transform: translateX(116px);
            transition: transform 1s ease;
        }
    </style>
    <script>
        function myfunction(){
            console.log("hi there");
            let circle=document.getElementById("circle");
            console.log(circle.classList);
            let list=circle.classList;
            let check=list.contains("bus");
            console.log(check);
            if(check){
                circle.classList.remove("bus");
                circle.classList.add("bus1");
                document.getElementById("bod").style.background= "pink";
                document.getElementById("tog").style.backgroundColor="gray";
            }
            else{
                circle.classList.remove("bus1");
                document.getElementById("tog").style.backgroundColor="blue";
                document.getElementById("bod").style.background= "lightgreen";
                circle.classList.add("bus");
            }
        }
    </script>
</head>
<body>
    <div class="bod" id="bod">
    <div class="toggle" id="tog">
        <div class="sub" onclick="myfunction()" id="circle"></div>
    </div>
    </div>
</body>
</html>
