<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        /* align-content: center; */
        height: 100vh;
      }
      .main {
        background-color: gray;
        height: 500px;
        width: 400px;
        /* display: flex; */
        /* flex-wrap: wrap; */
        box-shadow: 2px 2px 4px black;
        border: none;
      }
      .main .head {
        /* flex-wrap: nowrap; */
        background-color: rgb(255, 255, 255);
        height: 10%;
        text-align: center;
        border: 0px solid black;
        align-content: center;
      }
      .main .value {
        /* flex-wrap: nowrap; */
        background-color: rgb(255, 255, 255);
        height: 10%;
        text-align: center;
        border: 0px solid black;
        align-content: center;
      }
      .main .body {
        background-color: rgb(0, 255, 42);
        height: 500px;
        display: grid;
        grid-template-columns: 100px 100px 100px 100px;
        cursor: pointer;
      }
      .body .sub {
        background-color: orange;
        border: 0px solid black;
        text-align: center;
        align-content: center;
        box-shadow: inset 2px 2px 2px black;
      }
      .sub:hover {
        transform: scale(105%);
        transition: transform 0.01s ease;
      }
      #plus {
        grid-row: 2/4;
        grid-column: 4/5;
      }
      #enter {
        grid-row: 4/6;
        grid-column: 4/5;
      }
      #zero {
        grid-column: 1/3;
      }
      #value {
        width: 99%;
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="head">Calculator</div>
      <input type="text" value="0" class="value" id="value" />
      <div class="body">
        <div class="sub" onclick="myFunction(event)" id="reset">reset</div>
        <div class="sub" onclick="myFunction(event)" id="div" data-value="/">
          /
        </div>
        <div class="sub" onclick="myFunction(event)" id="mul" data-value="*">
          *
        </div>
        <div class="sub" onclick="myFunction(event)" id="sub" data-value="-">
          -
        </div>
        <div class="sub" onclick="myFunction(event)" id="7" data-value="7">
          7
        </div>
        <div class="sub" onclick="myFunction(event)" id="8" data-value="8">
          8
        </div>
        <div class="sub" onclick="myFunction(event)" id="9" data-value="9">
          9
        </div>
        <div class="sub" onclick="myFunction(event)" id="plus" data-value="+">
          +
        </div>
        <div class="sub" onclick="myFunction(event)" id="4" data-value="4">
          4
        </div>
        <div class="sub" onclick="myFunction(event)" id="5" data-value="5">
          5
        </div>
        <div class="sub" onclick="myFunction(event)" id="6" data-value="6">
          6
        </div>
        <div class="sub" onclick="myFunction(event)" id="1" data-value="1">
          1
        </div>
        <div class="sub" onclick="myFunction(event)" id="2" data-value="2">
          2
        </div>
        <div class="sub" onclick="myFunction(event)" id="3" data-value="3">
          3
        </div>
        <div class="sub" onclick="myFunction(event)" id="enter">enter</div>
        <div class="sub" onclick="myFunction(event)" id="zero" data-value="0">
          0
        </div>
        <div class="sub" onclick="myFunction(event)" id="dot">.</div>
      </div>
    </div>
    <script>
      let div = document.getElementById("div");
      let mul = document.getElementById("mul");
      let sub = document.getElementById("sub");
      let dot = document.getElementById("dot");
      let enter = document.getElementById("enter");
      let add = document.getElementById("plus");
      let value = document.getElementById("value");
      let reset = document.getElementById("reset");
      // console.log(add);

      let val1, val2, op;
      let count = 0;
      async function myFunction(event) {
        let res;
        let evt = event.target;
        // console.log(evt);
        // console.log(evt.dataset.value);
        let subfun = async () => {
          if (count == 0) {
            val1 = evt.dataset.value;
            console.log(val1);
            count += 1;
            // console.log(count);
          } else if (count == 1) {
            op = evt.dataset.value;
            console.log(op);
            count += 1;
            // console.log(count);
          } else if (count == 2) {
            val2 = evt.dataset.value;
            console.log(val2);
            count = 0;
            // console.log(count);
          }
          return [val1, op, val2];
        };
        let p1 = await subfun();
        // console.log(p1);

        let fun2 = async () => {
          let v1 = null;
          let v2 = null;
          let v3 = null;
          v1 = p1[0];
          v2 = p1[1];
          v3 = p1[2];
          if (v2 == null) {
            v2 = " ";
          }
          if (v3 == null) {
            v3 = " ";
          }
          console.log(v1, v2, v3);
          res = v1 + v2 + v3;
          value.value = res;
          v11 = Number.parseInt(v1);
          v33 = Number.parseInt(v3);
          v22=v2;
          return([v11,v22,v33])
          // console.log(typeof v11);
        };
        let p2 = await fun2();

        let fun3 = async () => {
          let result;
          let sumorg;
          console.log(v11, v33,v22);
          let sum = v11 + v33;
          let minus = v11 - v33;
          let divition = v11 / v33;
          let multiply = v11 * v33;
          console.log(sum, minus, divition, multiply);

          let flag = 0;
          let arr = [sum, minus, divition, multiply];
          arr.forEach((element) => {
            if (!isNaN(element)) {
              flag = 1;
              console.log("every nmber came");
            }
          });
          console.log(v22);
          if(flag==1){
            if(v22=='+'){
                value.value=arr[0];
            }
            if(v22=='-'){
                value.value=arr[1];
            }
            if(v22=='/'){
                value.value=arr[2];
            }
            if(v22=='*'){
                value.value=arr[3];
            }
                
          }

        };
        let p3 = await fun3();
        // console.log("hi there");
        if(evt==reset){
            value.value=null
        }
        // console.log(sumorg);
      }
    </script>
  </body>
</html>
