<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>load scrit using promise</title>
</head>
<body>
    <script>
        const loadScript=(src)=>{
            return new Promise(function(resolve,reject){
                let script=document.createElement("script");
                script.src=src;
                document.head.append(script)
                script.onload=()=>{
                    resolve("script loaded succesfully")
                }
                script.onerror=()=>{
                    reject(0)
                }
            })
        }
        let p1=loadScript("callback2.js")
        p1.then((value)=>{
            console.log(value);
        }).catch((error)=>{
            console.log("sorrry bro");
        }).then(()=>{
            return loadScript("promise.js")
        }).then((value)=>{
            console.log("second ready");
        }).catch((error)=>{
            console.log("second time bro");
        })
    </script>
</body>
</html>
